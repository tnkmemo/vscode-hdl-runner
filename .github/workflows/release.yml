name: Release VSIX

on:
  push:
    tags:
      - 'v*'   # v1.0.0 などのタグ push で実行

jobs:
  release:
    runs-on: windows-latest

    permissions:
      contents: write   # Release 作成に必須

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run compile

      - name: Run tests
        run: npm test

      - name: Package VSIX
        run: npx vsce package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.vsix"